name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1' # Weekly on Mondays to monitor Cinemeta upstream catalog changes
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Verify Cinemeta Canon
        run: npm run verify:cinemeta
